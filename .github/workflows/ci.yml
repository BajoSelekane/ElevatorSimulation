name: Elevator Simulation CI

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION: 'ElevatorSimulation.slnx'
  CONFIGURATION: 'Release'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  NUGET_XMLDOC_MODE: skip
  COVERAGE_THRESHOLD: '80'

jobs:
  restore-build-test:
    name: Restore, Build & xUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Build solution
        run: dotnet build "${{ env.SOLUTION }}" --configuration "${{ env.CONFIGURATION }}" --no-restore --verbosity minimal

      - name: Run unit tests (fast, with coverage)
        run: >
          dotnet test "${{ env.SOLUTION }}"
          --configuration "${{ env.CONFIGURATION }}"
          --no-build
          --no-restore
          --verbosity minimal
          --filter "Category=Unit"
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --logger "trx;LogFileName=unit-test-results.trx"
          --results-directory ./TestResults
          --blame-hang-timeout 60s

      - name: Run integration tests (coverage merge)
        run: >
          dotnet test "${{ env.SOLUTION }}"
          --configuration "${{ env.CONFIGURATION }}"
          --no-build
          --no-restore
          --verbosity minimal
          --filter "Category=Integration"
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --logger "trx;LogFileName=integration-test-results.trx"
          --results-directory ./TestResults
          --blame-hang-timeout 60s

      - name: Merge coverage reports
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.12
          reportgenerator \
            -reports:./TestResults/**/coverage.cobertura.xml \
            -targetdir:./CoverageReport \
            -reporttypes:HtmlInline_AzurePipelines;Cobertura;TextSummary \
            -assemblyfilters:"+ElevatorSimulation.Domain;+ElevatorSimulation.Application;+ElevatorSimulation.Infrastructure;-*.Tests;-*.Integration.Tests"

      - name: Check code coverage threshold
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, glob, xml.etree.ElementTree as ET

          threshold = int(os.environ.get("COVERAGE_THRESHOLD", "80"))
          path = "./CoverageReport/Cobertura.xml"
          if not os.path.isfile(path):
              matches = glob.glob("./TestResults/**/coverage.cobertura.xml", recursive=True)
              if not matches:
                  print("No coverage report found.", file=sys.stderr)
                  sys.exit(1)
              path = matches[0]

          root = ET.parse(path).getroot()
          rate = float(root.attrib.get("line-rate", "0"))
          percent = int(round(rate * 100))
          print(f"Line coverage: {percent}% (threshold {threshold}%)")
          if percent < threshold:
              print(f"Code coverage is below {threshold}% (current: {percent}%).", file=sys.stderr)
              sys.exit(1)
          print(f"Code coverage meets the {threshold}% threshold.")
          PY

      - name: Coverage summary
        if: always()
        run: |
          if [ -f ./CoverageReport/Summary.txt ]; then
            cat ./CoverageReport/Summary.txt
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./CoverageReport
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xunit-test-results
          path: ./TestResults
          if-no-files-found: warn
          retention-days: 14
