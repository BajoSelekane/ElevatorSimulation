name: Update Coverage Badge

on:
  push:
    branches: [ master, Elevator-Features/* ]
  workflow_dispatch:

jobs:
  update-badge:
    name: Update Coverage Badge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests with coverage
        run: |
          dotnet test \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --logger "console;verbosity=detailed" \
            --results-directory ./TestResults

      - name: Generate coverage report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool >/dev/null
          reportgenerator \
            -reports:./TestResults/**/coverage.cobertura.xml \
            -targetdir:./CoverageReport \
            "-reporttypes:HtmlInline_AzurePipelines;Cobertura"

      - name: Extract coverage percentage
        id: coverage
        run: |
          set -e

          COVERAGE_FILE=./CoverageReport/Cobertura.xml
          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "Cobertura report not found at $COVERAGE_FILE"
            echo "coverage=0" >> $GITHUB_OUTPUT
            echo "coverage_color=red" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract LineRate (decimal between 0 and 1)
          COVERAGE=$(grep -oP 'LineRate="\K[0-9.]+' "$COVERAGE_FILE" | head -1 || echo "0")
          # Ensure numeric value for bc
          COVERAGE=${COVERAGE:-0}
          # Convert to percentage (rounded)
          COVERAGE_PERCENT=$(echo "scale=2; $COVERAGE * 100" | bc -l | awk '{printf("%d", $0 + 0.5)}')

          # Determine badge color
          COLOR=yellow
          if [ "$COVERAGE_PERCENT" -ge 90 ]; then
            COLOR=green
          elif [ "$COVERAGE_PERCENT" -lt 50 ]; then
            COLOR=red
          fi

          echo "coverage=$COVERAGE_PERCENT" >> $GITHUB_OUTPUT
          echo "coverage_color=$COLOR" >> $GITHUB_OUTPUT

      - name: Generate coverage badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: coverage-badge.json
          label: Coverage
          message: ${{ steps.coverage.outputs.coverage }}%
          color: ${{ steps.coverage.outputs.coverage_color }}
          namedLogo: xunit